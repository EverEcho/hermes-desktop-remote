[package]
name = "rhermes"
version = "0.1.0"
description = "RHermes"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
capacitor-tauri = "0.0"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# capacitor:plugins:begin
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
# capacitor:plugins:end
