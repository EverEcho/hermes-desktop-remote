name: Build Desktop (macOS, no notarization)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.17.0-unsigned.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Import macOS Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build and Package macOS App Without Notarization
        env:
          # Keep Developer ID signing, but omit all notarization credentials.
          DEBUG: electron-osx-sign*
        run: yarn workspace hermes dist:mac

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-RHermes-Notarization-Skipped
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: RHermes ${{ inputs.release_tag }} (not notarized)
          body: |
            This build is signed with a Developer ID Application certificate but has not been notarized by Apple.
            macOS Gatekeeper may show a warning when opening it.
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
