name: Build Desktop (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Import macOS Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build and Package macOS App
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Print each nested component as @electron/osx-sign passes it to codesign.
          DEBUG: electron-osx-sign*
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf "%s" "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
            export APPLE_API_KEY="$KEY_PATH"
          fi
          yarn workspace hermes dist:mac

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-RHermes-Release
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
