name: Sync Upstream Desktop

on:
  schedule:
    # 每天 UTC 0:00 (北京时间 8:00) 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 界面手动触发

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote & sync
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          chmod +x ./scripts/sync-upstream-desktop.sh
          ./scripts/sync-upstream-desktop.sh

      - name: Create Pull Request if changes exist
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sync): import upstream Desktop changes"
          title: "chore(sync): import upstream Desktop changes"
          body-path: SYNC_SUMMARY.md
          branch: "chore/sync-upstream"
          delete-branch: true
          base: "main"
